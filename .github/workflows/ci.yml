name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Aynı dala yeni commit gelince eski çalışma iptal edilir.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kontroller:
    name: Lint ve tip kontrolü
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck
